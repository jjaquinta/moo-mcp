[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moo-mcp"
version = "0.1.0"
description = "MCP server for LambdaMOO administration: persistent connection, structured tools for eval/verbs/properties/topology, auto-verify on program."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ryan Bishop" }]
keywords = ["mcp", "lambdamoo", "moo", "mud"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp>=1.2.0",
  "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
moo-mcp = "moo_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/moo_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
